name: Test Flask App

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install flask

      - name: Run Flask app for smoke test
        env:
          FLASK_APP: app1.py
        run: |
          nohup python -m flask --app app1 run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 5
          cat flask.log
          curl -f http://127.0.0.1:5000 || (cat flask.log && exit 1)

      - name: Expose Flask app with ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          nohup python -m flask --app app1 run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 5
          nohup ngrok http 5000 > ngrok.log &
          sleep 5
          grep -o 'https://[0-9a-z]*\.ngrok-free\.app' ngrok.log

